spring:
  # Development-specific database (can use local PostgreSQL or Neon)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cms_dev?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Development server
server:
  port: 8080

# Development logging
logging:
  level:
    com.example.cms: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Development CORS
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  frontend:
    url: http://localhost:5173