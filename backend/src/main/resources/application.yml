spring:
  application:
    name: course-management-system
  profiles:
    # Keeps `mvn spring-boot:run` using application-local.yml for local development.
    # On Render set SPRING_PROFILES_ACTIVE=prod to use application-prod.yml.
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cms_dev?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  # Render supplies PORT. Locally, this falls back to SERVER_PORT and then 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    # Avoid leaking exception details in production; override locally if needed.
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Always provide a strong JWT_SECRET through environment variables in deployment.
    secret: ${JWT_SECRET:local-only-change-this-secret-before-production-0123456789}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    # Set to your actual frontend origin(s) on deployment, comma-separated.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  email:
    from: ${EMAIL_FROM:noreply@coursemanagement.com}
  pagination:
    default-page-size: 20
    max-page-size: 100

logging:
  level:
    com.example.cms: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
